[package]
name = "latte-rs"
version = "0.1.4"
edition = "2021"
description = "Rust SDK for LicenseLatte license activation and offline verification"
license = "MIT"
repository = "https://github.com/licenselatte/latte-rs"
readme = "README.md"
keywords = ["license", "licensing", "activation", "ed25519", "sdk"]
categories = ["authentication", "api-bindings"]

[dependencies]
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
dirs = { version = "5", optional = true }

[features]
default = ["http", "cache"]
# Network activation/renewal (Sdk::activate/Sdk::renew). Disable with
# `default-features = false` if you want to wire verify_activation_at/
# validate_at up to your own HTTP client instead; those functions never
# require this feature.
http = ["dep:reqwest"]
# On-disk token caching, wired into Sdk::activate/Sdk::renew/Sdk::check.
# Disable for embedded/sandboxed targets with no writable filesystem; the
# rest of the crate (including the http feature) works fine without it,
# just without the cache fast path and without Sdk::check.
cache = ["dep:dirs"]

[dev-dependencies]
getrandom = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
